[project]
name = "cs-decisions"
version = "0.1.0"
description = "Visualise Cloudsmith policy decision logs in the terminal or as an HTML dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.10",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
cs-decisions = "cs_decisions.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_decisions"]
