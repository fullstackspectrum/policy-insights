[project]
name = "policy-insights"
version = "1.0.0"
description = "Visualise Cloudsmith policy decision logs in the terminal or as an HTML dashboard (unofficial; not a Cloudsmith product)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.10",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
policy-insights = "policy_insights.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_insights"]
