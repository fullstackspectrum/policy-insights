<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0a0d12 radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px) 14px 14px / 28px 28px;
    position: relative; font-family: "Space Grotesk", sans-serif; color: #eef1f6;
  }
  .bar { position: absolute; left: 80px; top: 96px; display: flex; gap: 8px; }
  .bar i { width: 40px; height: 10px; border-radius: 1px; }
  .brand { position: absolute; left: 80px; top: 150px; display: flex; align-items: center; gap: 32px; }
  .brand img { width: 104px; height: 104px; }
  .brand h1 { margin: 0; font-weight: 700; font-size: 96px; letter-spacing: -0.04em; line-height: 1; }
  .lede { position: absolute; left: 80px; top: 300px; font: 400 26px/1 "JetBrains Mono", monospace; color: #9aa4b2; display: flex; align-items: center; }
  .lede b { display: inline-block; width: 14px; height: 30px; background: #ff4d5e; margin-left: 10px; }
  .url { position: absolute; left: 80px; bottom: 80px; font: 400 22px/1 "JetBrains Mono", monospace; color: #9aa4b2; }
  .url::before { content: "▪ "; color: #ff4d5e; }
  svg.chart { position: absolute; right: 80px; bottom: 70px; }
</style></head>
<body>
  <div class="bar"><i style="background:#4f8cff"></i><i style="background:#8fb4ff"></i><i style="background:#f5c84c"></i><i style="background:#ff8a3d"></i><i style="background:#ff4d5e"></i></div>
  <div class="brand"><img src="../../policy-insights-mark.svg" alt=""><h1>Policy Insights</h1></div>
  <div class="lede">Which policies do the work, and which are noise.<b></b></div>
  <div class="url">github.com/fullstackspectrum/policy-insights</div>
  <svg class="chart" width="440" height="200" viewBox="0 0 600 230" id="chart"></svg>
<script>
  // Same chart as the README banner: matched (blue) under unmatched (grey), busiest matched day ringed in red.
  const matched =   [38, 44, 35, 52, 47, 30, 41, 66, 58, 61, 49, 72, 95, 80];
  const unmatched = [70, 64, 78, 60, 74, 88, 66, 72, 80, 62, 84, 70, 60, 74];
  const svg = document.getElementById("chart");
  const H = 220, base = 218, peak = 180, n = matched.length, slot = 600 / n, w = 14, off = (slot - w) / 2;
  let out = "";
  [0, 1, 2].forEach((i) => { const y = base - i * 63; out += `<line x1="0" x2="600" y1="${y}" y2="${y}" stroke="#222b38" stroke-width="1.5"/>`; });
  const tops = [];
  matched.forEach((m, i) => {
    const x = i * slot + off, hm = m / peak * H * .8, hu = unmatched[i] / peak * H * .8 * .5;
    out += `<rect x="${x}" y="${base - hm}" width="${w}" height="${hm}" rx="2" fill="#4f8cff"/>`;
    out += `<rect x="${x}" y="${base - hm - hu - 3}" width="${w}" height="${hu}" rx="2" fill="#2f3a4b"/>`;
    tops.push(base - hm - hu - 3);
  });
  const busiest = matched.indexOf(Math.max(...matched)), cx = busiest * slot + off + w / 2, cy = tops[busiest] - 24;
  out += `<circle cx="${cx}" cy="${cy}" r="7" fill="#ff4d5e"/><circle cx="${cx}" cy="${cy}" r="15" fill="none" stroke="#ff4d5e" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  svg.innerHTML = out;
</script>
</body></html>
